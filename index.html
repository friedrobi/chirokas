<style>

  .qr-card{

<script>
/* ---------- Storage helpers (Firestore) ---------- */
let settings = { naam:'', iban:'', bic:'', rekeninghouder:'', nextRef: 1, standaardLidgeld: 50, inschrijvingOpen: true, mollieEnabled: false, mollieWorkerUrl: '' };
let members = [];
let ledger = [];

function waitForFirestore(){
  return new Promise((resolve, reject)=>{
    if(window.__firestoreReady) return resolve();
    const iv = setInterval(()=>{
      if(window.__firestoreReady){ clearInterval(iv); resolve(); }
      if(window.__firestoreError){ clearInterval(iv); reject(new Error('Firebase-aanmelding mislukt')); }
    }, 40);
    setTimeout(()=>{ clearInterval(iv); reject(new Error('Firebase reageerde niet op tijd — controleer je firebaseConfig.')); }, 12000);
  });
}

async function loadAll(){
  const { doc, getDoc, db } = window.__firestore;
  try{
    const s = await getDoc(doc(db,'chirokas','settings'));
    if(s.exists()) settings = { ...settings, ...s.data() };
  }catch(e){}
  try{
    const m = await getDoc(doc(db,'chirokas','members'));
    if(m.exists()) members = m.data().list || [];
  }catch(e){}
  try{
    const l = await getDoc(doc(db,'chirokas','ledger'));
    if(l.exists()) ledger = l.data().list || [];
  }catch(e){}
  let idsAssigned = false;
  members.forEach((m,idx)=>{ if(!m.id){ m.id = Date.now() + idx; idsAssigned = true; } });
  if(idsAssigned) await saveMembers();
}
async function saveSettings(){
  try{ const { doc, setDoc, db } = window.__firestore; await setDoc(doc(db,'chirokas','settings'), settings); }
  catch(e){ toast('Opslaan mislukt, probeer opnieuw.'); }
}
async function saveMembers(){
  try{ const { doc, setDoc, db } = window.__firestore; await setDoc(doc(db,'chirokas','members'), { list: members }); }
  catch(e){ toast('Opslaan mislukt, probeer opnieuw.'); }
}
async function saveLedger(){
  try{ const { doc, setDoc, db } = window.__firestore; await setDoc(doc(db,'chirokas','ledger'), { list: ledger }); }
  catch(e){ toast('Opslaan mislukt, probeer opnieuw.'); }
}

/* ---------- Belgian OGM (gestructureerde mededeling) ---------- */
function generateOGM(){
  const seq = settings.nextRef || 1;
  const base = String(seq).padStart(10,'0');
  let rem = parseInt(base,10) % 97;
  if(rem===0) rem = 97;
  const checksum = String(rem).padStart(2,'0');
  const full = base + checksum;
  const formatted = `+++${full.slice(0,3)}/${full.slice(3,7)}/${full.slice(7,12)}+++`;
  return { raw: full, formatted };
}

/* ---------- IBAN mod-97 check (ISO 7064) ---------- */
function ibanValid(iban){
  const clean = (iban||'').replace(/\s+/g,'').toUpperCase();
  if(clean.length < 15 || !/^[A-Z]{2}[0-9A-Z]+$/.test(clean)) return false;
  const rearr = clean.slice(4) + clean.slice(0,4);
  let numStr = '';
  for(const ch of rearr){
    if(/[0-9]/.test(ch)) numStr += ch;
    else numStr += (ch.charCodeAt(0) - 55).toString();
  }
  let rem = 0;
  for(const d of numStr){ rem = (rem*10 + parseInt(d,10)) % 97; }
  return rem === 1;
}

/* ---------- EPC QR payload ---------- */
function buildEpcPayload(amount, ogmRaw){
  const iban = (settings.iban||'').replace(/\s+/g,'').toUpperCase();
  const name = (settings.rekeninghouder || settings.naam || '').slice(0,70);
  const amt = 'EUR' + Number(amount).toFixed(2);
  const lines = ['BCD','002','1','SCT', settings.bic ? settings.bic.replace(/\s+/g,'').toUpperCase() : '', name, iban, amt, '', ogmRaw, ''];
  return lines.join('\n');
}

/* ---------- Formatting ---------- */
function euro(n){ return '€ ' + Number(n||0).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ---------- Categories ---------- */
const INCOME_CATS = ['Lidgeld','Kampinschrijving','Activiteiten','Subsidies','Giften','Overige inkomsten'];
const EXPENSE_CATS = ['Materiaal','Kamp','Verzekering','Lokalen','Vorming leiding','Eten & drank','Overige kosten'];
const AFDELINGEN = ['Pagatters','Speelclub jongens','Speelclub meisjes','Rakkers','Kwiks','Tippers','Toppers','Kerels','Tiptiens','Aspi jongens','Aspi meisjes','Leiding'];

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- State ---------- */
let activeTab = 'dashboard';

function setTab(tab){ activeTab = tab; render(); }

/* ---------- Render root ---------- */
function render(){
  const app = document.getElementById('app');
  const balance = ledger.filter(e=>!e.isTest).reduce((s,e)=> s + (e.type==='in'? e.bedrag : -e.bedrag), 0);
  app.innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <p class="header-eyebrow">Chirokas</p>
          <h1 class="header-title">${settings.naam ? escapeHtml(settings.naam) : 'Jouw Chiro'}</h1>
        </div>
        <div class="header-balance">
          <div class="amt tnum">${euro(balance)}</div>
          <div class="lbl">huidig saldo</div>
        </div>
      </div>
    </div>
    ${settings.testMode ? `<div class="test-banner"><span>🧪 Testmodus actief — nieuwe leden en boekingen worden gemarkeerd als test en tellen niet mee in het echte saldo.</span><button onclick="toggleTestMode()">Zet uit</button></div>` : ''}
    <div class="nav">
      <button data-tab="dashboard" class="${activeTab==='dashboard'?'active':''}">Overzicht</button>
      <button data-tab="leden" class="${activeTab==='leden'?'active':''}">Leden</button>
      <button data-tab="boekhouding" class="${activeTab==='boekhouding'?'active':''}">Boekhouding</button>
      <button data-tab="mailing" class="${activeTab==='mailing'?'active':''}">Herinneringen</button>
      <button data-tab="instellingen" class="${activeTab==='instellingen'?'active':''}">Instellingen</button>
    </div>
    <div id="section-dashboard" class="section ${activeTab==='dashboard'?'active':''}"></div>
    <div id="section-leden" class="section ${activeTab==='leden'?'active':''}"></div>
    <div id="section-boekhouding" class="section ${activeTab==='boekhouding'?'active':''}"></div>
    <div id="section-mailing" class="section ${activeTab==='mailing'?'active':''}"></div>
    <div id="section-instellingen" class="section ${activeTab==='instellingen'?'active':''}"></div>
    <p class="footnote">Gegevens van Chirokas worden gedeeld tussen alle leiding die deze app opent — iedereen ziet en bewerkt dezelfde ledenlijst en boekhouding.</p>
  `;
  app.querySelectorAll('.nav button').forEach(b=> b.onclick = ()=> setTab(b.dataset.tab));
  renderDashboard();
  renderLeden();
  renderBoekhouding();
  renderMailing();
  renderInstellingen();
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

async function toggleTestMode(){
  settings.testMode = !settings.testMode;
  await saveSettings();
  render();
  toast(settings.testMode ? 'Testmodus aan.' : 'Testmodus uit.');
}

/* ---------- Dashboard ---------- */
function renderAfdelingBreakdown(){
  const year = new Date().getFullYear();
  const groups = [...AFDELINGEN, '(Geen afdeling)'];
  const rows = groups.map(g=>{

async function mergeDuplicate(dupId){
  const dupIdx = members.findIndex(m=>m.id===dupId);
  if(dupIdx<0) return;
  const dup = members[dupIdx];
  const canonicalIdx = members.findIndex(c=>c.id===dup.possibleDuplicateOf);
  if(canonicalIdx<0){ toast('Bestaand lid niet meer gevonden.'); return; }
  const canonical = members[canonicalIdx];
  if(dup.afdeling) canonical.afdeling = dup.afdeling;
  if(dup.geboortedatum) canonical.geboortedatum = dup.geboortedatum;
  if(dup.email) canonical.email = dup.email;
  if(dup.gsm) canonical.gsm = dup.gsm;
  if(dup.notities) canonical.notities = ((canonical.notities||'') + (canonical.notities?'\n':'') + dup.notities).trim();
  if(dup.bedrag) canonical.bedrag = dup.bedrag;
  members.splice(dupIdx,1);
  await saveMembers();
  render();
  toast('Samengevoegd met bestaand lid.');
}
async function keepSeparateDuplicate(dupId){
  const dup = members.find(m=>m.id===dupId);
  if(!dup) return;
  dup.dupResolved = true;
  await saveMembers();
  render();
  toast('Als apart lid bevestigd.');
}

/* ---------- Excel import ---------- */
function findKey(row, patterns){
  const keys = Object.keys(row);
  for(const p of patterns){
    const hit = keys.find(k => p.test(k.trim()));
    if(hit) return hit;
  }
  return null;
}
async function handleExcelImport(evt){
  const file = evt.target.files[0];
  const status = document.getElementById('xl-status');
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    status.textContent = 'Excel-bibliotheek kon niet geladen worden. Probeer opnieuw of controleer je internetverbinding.';
    return;
  }
  status.textContent = 'Bestand wordt ingelezen…';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    if(rows.length === 0){ status.textContent = 'Geen rijen gevonden in dit bestand.'; return; }

    let added = 0, updated = 0, skipped = 0, onbekendeAfdeling = 0;
    for(const row of rows){
      const naamKey = findKey(row, [/^naam$/i, /name/i]);
      const bedragKey = findKey(row, [/lidgeld/i, /bedrag/i, /prijs/i, /amount/i]);
      const emailKey = findKey(row, [/e-?mail/i]);
      const gsmKey = findKey(row, [/gsm/i, /mobiel/i, /telefoon/i, /tel\.?$/i, /phone/i]);
      const afdelingKey = findKey(row, [/afdeling/i, /groep/i, /^tak$/i]);
      const notitiesKey = findKey(row, [/notitie/i, /notes?/i, /opmerking/i]);
      const naam = naamKey ? String(row[naamKey]).trim() : '';
      if(!naam){ skipped++; continue; }
      let bedrag = bedragKey ? parseFloat(String(row[bedragKey]).replace(',', '.')) : NaN;
      if(isNaN(bedrag) || bedrag < 0) bedrag = 0;
      const email = emailKey ? String(row[emailKey]).trim() : '';
      const gsm = gsmKey ? String(row[gsmKey]).trim() : '';
      const notities = notitiesKey ? String(row[notitiesKey]).trim() : '';
      const afdelingRaw = afdelingKey ? String(row[afdelingKey]).trim() : '';
      const afdeling = afdelingRaw ? (AFDELINGEN.find(a=>a.toLowerCase()===afdelingRaw.toLowerCase()) || '') : '';
      if(afdelingRaw && !afdeling) onbekendeAfdeling++;

      const existing = members.findIndex(m => m.naam.trim().toLowerCase() === naam.toLowerCase());
      if(existing >= 0){
        members[existing].bedrag = bedrag || members[existing].bedrag;
        if(email) members[existing].email = email;
        if(gsm) members[existing].gsm = gsm;
        if(afdeling) members[existing].afdeling = afdeling;
        if(notities) members[existing].notities = notities;
        updated++;
      }else{
        members.push({ id: Date.now()+added, naam, bedrag, email, gsm, afdeling, notities, paidThisYear:false, isTest: !!settings.testMode });
        added++;
      }
    }
    await saveMembers();
    render();
    let msg = `${added} lid/leden toegevoegd, ${updated} bijgewerkt.`;
    if(skipped) msg += ` ${skipped} rij(en) zonder naam overgeslagen.`;
    if(onbekendeAfdeling) msg += ` ${onbekendeAfdeling} afdelingsnaam(en) niet herkend en leeggelaten.`;
    toast(msg);
    document.getElementById('xl-status') && (document.getElementById('xl-status').textContent = msg);
  }catch(e){
    status.textContent = 'Kon dit bestand niet inlezen. Controleer of het een geldig Excel- of CSV-bestand is.';
  }
  evt.target.value = '';
}

  `;

/* ---------- Stabiele referte per lid (nodig om later te kunnen afpunten) ---------- */
async function ensureMemberOgm(i){
  const m = members[i];
  if(m.openOgm && m.openOgm.raw) return m.openOgm;
  const ogm = generateOGM();
  m.openOgm = { raw: ogm.raw, formatted: ogm.formatted };
  settings.nextRef = (settings.nextRef||1) + 1;
  await Promise.all([saveMembers(), saveSettings()]);
  return m.openOgm;
}
function formatOgmDisplay(raw){
  if(!raw || raw.length!==12) return raw||'';
  return `+++${raw.slice(0,3)}/${raw.slice(3,7)}/${raw.slice(7,12)}+++`;
}

async function downloadMemberQr(i){
  const m = members[i];
  if(!settings.iban || !ibanValid(settings.iban)){ toast('Vul eerst een geldig IBAN in bij Instellingen.'); return; }
  if(typeof QRCode === 'undefined'){ toast('QR-bibliotheek niet geladen.'); return; }
  const ogm = await ensureMemberOgm(i);
  const payload = buildEpcPayload(m.bedrag, ogm.raw);
  const hidden = document.createElement('div');
  hidden.style.position='fixed'; hidden.style.left='-9999px';
  document.body.appendChild(hidden);
  try{
    new QRCode(hidden, { text: payload, width:300, height:300, correctLevel: QRCode.CorrectLevel.M });
    const img = hidden.querySelector('img');
    const canvas = hidden.querySelector('canvas');
    const dataUrl = img && img.src ? img.src : (canvas ? canvas.toDataURL('image/png') : null);
    if(!dataUrl) throw new Error('geen QR gegenereerd');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `betaal-qr-${slug(m.naam)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    toast('QR-code kon niet gedownload worden.');
  }
  document.body.removeChild(hidden);
}

function buildMemberMailContent(m, ogm){
  const chiroNaam = settings.naam || 'de Chiro';

  return { subject, body };
}

async function openMailDraft(i){

  if(!m.email){ toast('Dit lid heeft geen e-mailadres.'); return; }

/* ---------- WhatsApp (click-to-chat, geen bulkverzending mogelijk zonder WhatsApp Business API) ---------- */
function formatWhatsappNumber(raw){
  if(!raw) return null;
  let digits = raw.replace(/[^\d+]/g,'').replace(/\s+/g,'');
  if(digits.startsWith('+')) digits = digits.slice(1);
  else if(digits.startsWith('00')) digits = digits.slice(2);
  else if(digits.startsWith('0')) digits = '32' + digits.slice(1);
  return digits.length >= 8 ? digits : null;
}
function buildWhatsappText(m, ogm){
  const chiroNaam = settings.naam || 'de Chiro';
  return `Hallo! Graag ontvangen we het lidgeld voor ${m.naam} bij ${chiroNaam}.\n\nBedrag: ${euro(m.bedrag)}\nRekeningnummer: ${settings.iban}\nMededeling: ${ogm.formatted}\n\nAlvast bedankt!`;
}
async function openWhatsapp(i){
  const m = members[i];
  if(!settings.iban || !ibanValid(settings.iban)){ toast('Vul eerst een geldig IBAN in bij Instellingen.'); return; }
  if(!m.gsm){ toast('Dit lid heeft geen gsm-nummer.'); return; }
  const num = formatWhatsappNumber(m.gsm);
  if(!num){ toast('Kon geen geldig nummer maken van dit gsm-nummer.'); return; }
  const ogm = await ensureMemberOgm(i);
  const text = buildWhatsappText(m, ogm);
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(text)}`, '_blank');
  setTimeout(()=>{ if(confirm(`WhatsApp geopend voor ${m.naam}. Markeren als verstuurd?`)) markReminderSent(i); }, 800);
}

function emailjsReady(){

}

async function sendMemberEmail(i){
  const m = members[i];
  if(!settings.iban || !ibanValid(settings.iban)){ toast('Vul eerst een geldig IBAN in bij Instellingen.'); return; }
  if(!m.email){ toast('Dit lid heeft geen e-mailadres.'); return; }
  if(!emailjsReady()){ toast('E-mailservice is nog niet ingesteld — zie README.md.'); return; }
  const ogm = await ensureMemberOgm(i);
  const { subject, body } = buildMemberMailContent(m, ogm);
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: m.email, to_name: m.naam, subject, message: body });
    members[i].reminderSentAt = new Date().toISOString();
    await saveMembers();
    render();
    toast(`Mail verstuurd naar ${m.naam}.`);
  }catch(e){
    toast(`Versturen naar ${m.naam} mislukt.`);
  }
}

async function sendAllMails(){
  if(!emailjsReady()){ toast('E-mailservice is nog niet ingesteld — zie README.md.'); return; }
  if(!settings.iban || !ibanValid(settings.iban)){ toast('Vul eerst een geldig IBAN in bij Instellingen.'); return; }
  const withEmail = members.filter(m=>!m.isTest && m.email && m.email.trim());
  const eligible = withEmail.filter(m=> !mailingOnlyOpen || !m.paidThisYear);
  if(eligible.length===0){ toast('Geen leden om naar te versturen.'); return; }
  if(!confirm(`Mail versturen naar ${eligible.length} lid/leden?`)) return;
  let sent=0, failed=0;
  for(const m of eligible){
    const i = members.indexOf(m);
    try{
      const ogm = await ensureMemberOgm(i);
      const { subject, body } = buildMemberMailContent(members[i], ogm);
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: members[i].email, to_name: members[i].naam, subject, message: body });
      members[i].reminderSentAt = new Date().toISOString();
      sent++;
    }catch(e){ failed++; }
    await new Promise(r=>setTimeout(r, 400));
  }
  await saveMembers();
  render();
  toast(`${sent} mail(s) verstuurd${failed ? ', ' + failed + ' mislukt' : ''}.`);
}

/* ---------- Rekeninguittreksel importeren (CODA) & boeken ---------- */
let codaTransactions = [];

function codaField(line, start, end){ return line.substring(start-1, end); }

function codaDateToIso(ddmmjj){
  if(!ddmmjj || ddmmjj.length!==6 || ddmmjj==='000000') return todayStr();
  const dd=ddmmjj.slice(0,2), mm=ddmmjj.slice(2,4), yy=ddmmjj.slice(4,6);
  const yyyy = (parseInt(yy,10) < 70 ? '20' : '19') + yy;
  return `${yyyy}-${mm}-${dd}`;
}

function parseCoda(text){
  const lines = text.split(/\r\n|\r|\n/);
  const transactions = [];
  const byVolgnummer = {};
  for(const line of lines){
    if(line.length < 60 || line[0] !== '2') continue;
    const artikel = line[1];
    if(artikel === '1'){
      const volgnummer = codaField(line,3,6);
      const teken = codaField(line,32,32);
      const bedragRaw = codaField(line,33,47).replace(/\D/g,'');
      const bedrag = bedragRaw ? parseInt(bedragRaw,10)/1000 : 0;
      const valutadatum = codaField(line,48,53);
      const soortMed = codaField(line,62,62);
      const medZone = line.substring(62,115);
      let ogmRaw = null, vrijeMededeling = null;
      if(soortMed === '1'){
        const mtype = medZone.substring(0,3);
        const inhoud = medZone.substring(3);
        if(mtype === '101' || mtype === '102'){
          ogmRaw = inhoud.substring(0,12).replace(/\s/g,'');
        } else {
          vrijeMededeling = inhoud.trim();
        }
      } else {
        vrijeMededeling = medZone.trim();
      }
      const boekingsdatum = codaField(line,116,121);
      const tx = {
        volgnummer,
        type: teken==='0' ? 'in' : 'out',
        bedrag,
        datum: codaDateToIso(boekingsdatum && boekingsdatum!=='000000' ? boekingsdatum : valutadatum),
        ogmRaw, vrijeMededeling, tegenpartij: null
      };
      transactions.push(tx);
      byVolgnummer[volgnummer] = tx;
    } else if(artikel === '3'){
      const volgnummer = codaField(line,3,6);
      const naam = codaField(line,48,82).trim();
      if(byVolgnummer[volgnummer] && naam) byVolgnummer[volgnummer].tegenpartij = naam;
    }
  }
  return transactions.filter(t=>t.bedrag>0);
}

function computeCodaKey(tx){
  return tx.ogmRaw || `${tx.datum}|${tx.bedrag.toFixed(2)}|${tx.type}|${(tx.vrijeMededeling||'').trim()}`;
}

function matchCodaTx(tx){
  const key = computeCodaKey(tx);
  if(ledger.some(e=>e.codaKey === key)) return { status:'geboekt' };
  if(tx.type==='in' && tx.ogmRaw){
    const idx = members.findIndex(m=>!m.paidThisYear && !m.isTest && m.openOgm && m.openOgm.raw === tx.ogmRaw);
    if(idx>=0) return { status:'match', memberIndex: idx };
  }
  return { status:'open' };
}

async function markPaidFromCoda(memberIndex, tx){
  const m = members[memberIndex];
  m.paidThisYear = true;
  m.openOgm = null;
  await saveMembers();
  const ref = tx.ogmRaw ? formatOgmDisplay(tx.ogmRaw) : (tx.vrijeMededeling || tx.tegenpartij || '');
  ledger.push({ id: Date.now(), datum: tx.datum, omschrijving: `Lidgeld ${m.naam} (rekeninguittreksel${ref?': '+ref:''})`, categorie:'Lidgeld', bedrag: tx.bedrag, type:'in', afdeling: m.afdeling||'', isTest: !!m.isTest, ogmRaw: tx.ogmRaw||null, codaKey: computeCodaKey(tx) });
  await saveLedger();
}

async function bookCodaTxAsMember(idx, memberIndex){
  const tx = codaTransactions[idx];
  await markPaidFromCoda(parseInt(memberIndex,10), tx);
  codaTransactions.splice(idx,1);
  render();
  toast('Betaling gekoppeld en afgepunt.');
}

async function bookCodaTxGeneral(idx){
  const tx = codaTransactions[idx];
  const catSel = document.getElementById(`coda-cat-${idx}`);
  const afdelingSel = document.getElementById(`coda-afdeling-${idx}`);
  const categorie = catSel.value;
  const afdeling = afdelingSel ? afdelingSel.value : '';
  const omschrijving = tx.vrijeMededeling || tx.tegenpartij || (tx.ogmRaw ? formatOgmDisplay(tx.ogmRaw) : (tx.type==='in' ? 'Inkomst rekeninguittreksel' : 'Uitgave rekeninguittreksel'));
  ledger.push({ id: Date.now(), datum: tx.datum, omschrijving, categorie, bedrag: tx.bedrag, type: tx.type, afdeling, isTest: false, ogmRaw: tx.ogmRaw||null, codaKey: computeCodaKey(tx) });
  await saveLedger();
  codaTransactions.splice(idx,1);
  render();
  toast('Boeking toegevoegd.');
}

async function handleCodaImport(evt){
  const file = evt.target.files[0];
  const status = document.getElementById('coda-status');
  if(!file) return;
  status.textContent = 'Bestand wordt gelezen…';
  try{
    const text = await file.text();
    const txs = parseCoda(text);
    codaTransactions = txs;
    status.textContent = txs.length===0
      ? 'Geen verrichtingen gevonden. Is dit een geldig CODA-bestand (.coda)?'
      : `${txs.length} verrichting(en) gevonden.`;
  }catch(e){
    status.textContent = 'Kon dit bestand niet lezen. Vraag bij je bank een CODA-bestand (.coda) van je rekeninguittreksels op.';
    codaTransactions = [];
  }
  evt.target.value = '';
  renderBoekhouding();
}

async function confirmCodaMatch(txIdx){
  const tx = codaTransactions[txIdx];
  const r = matchCodaTx(tx);
  if(r.status !== 'match') return;
  await markPaidFromCoda(r.memberIndex, tx);
  codaTransactions.splice(txIdx,1);
  render();
  toast('Betaling afgepunt.');
}
function dismissCodaTx(txIdx){
  codaTransactions.splice(txIdx,1);
  renderBoekhouding();
}
async function confirmAllCodaMatches(){
  const toProcess = [];
  codaTransactions.forEach(tx=>{
    const r = matchCodaTx(tx);
    if(r.status==='match') toProcess.push({tx, memberIndex:r.memberIndex});
  });
  if(toProcess.length===0) return;
  for(const {tx, memberIndex} of toProcess){
    await markPaidFromCoda(memberIndex, tx);
  }
  const processedKeys = new Set(toProcess.map(p=>computeCodaKey(p.tx)));
  codaTransactions = codaTransactions.filter(tx=> !processedKeys.has(computeCodaKey(tx)));
  render();
  toast(`${toProcess.length} betaling(en) afgepunt.`);
}

function renderCodaReview(){
  if(codaTransactions.length === 0) return '';
  const openMembersOptions = members.filter(m=>!m.paidThisYear && !m.isTest);
  const rows = codaTransactions.map((tx,idx)=>{
    const r = matchCodaTx(tx);
    const omschrijving = tx.ogmRaw ? formatOgmDisplay(tx.ogmRaw) : (tx.vrijeMededeling || tx.tegenpartij || '(geen mededeling)');
    let actionHtml = '';
    if(r.status==='geboekt'){
      actionHtml = `<span class="pill test">Al geboekt</span>`;
    } else if(r.status==='match'){
      actionHtml = `<span class="pill paid">${escapeHtml(members[r.memberIndex].naam)}</span> <button class="btn btn-primary btn-sm" onclick="confirmCodaMatch(${idx})">Bevestig</button>`;
    } else {
      const cats = tx.type==='in' ? INCOME_CATS : EXPENSE_CATS;
      actionHtml = `
        <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-start;">
          <select id="coda-cat-${idx}" style="font-size:12.5px; padding:6px 8px;">
            ${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
          <select id="coda-afdeling-${idx}" style="font-size:12.5px; padding:6px 8px;">${afdelingOptions('')}</select>
          <button class="btn btn-primary btn-sm" onclick="bookCodaTxGeneral(${idx})">Boek als ${tx.type==='in'?'inkomst':'uitgave'}</button>
          ${tx.type==='in' ? `
          <select id="coda-select-${idx}" style="font-size:12.5px; padding:6px 8px;">
            <option value="">— of koppel aan lid als lidgeld —</option>
            ${openMembersOptions.map(m=>`<option value="${members.indexOf(m)}">${escapeHtml(m.naam)}</option>`).join('')}
          </select>
          <button class="btn btn-ghost btn-sm" onclick="const v=document.getElementById('coda-select-${idx}').value; if(v) bookCodaTxAsMember(${idx}, v);">Koppel aan lid</button>` : ''}
          <button class="del-x" onclick="dismissCodaTx(${idx})" title="Negeren">✕ negeren</button>
        </div>`;
    }
    return `<tr><td class="tnum">${tx.datum}</td><td class="tnum ${tx.type==='in'?'amt-in':'amt-out'}">${tx.type==='in'?'+':'-'}${euro(tx.bedrag)}</td><td>${escapeHtml(omschrijving)}${tx.tegenpartij?`<br><span class="muted">${escapeHtml(tx.tegenpartij)}</span>`:''}</td><td>${actionHtml}</td></tr>`;
  }).join('');
  const matchCount = codaTransactions.filter(tx=>matchCodaTx(tx).status==='match').length;
  return `
    <div class="card">
      <h3 class="card-title">Te bevestigen (${codaTransactions.length})</h3>
      <p class="muted" style="margin-bottom:8px;">Elke verrichting kan als lidgeld aan een lid gekoppeld worden (indien inkomst), of als gewone inkomst of uitgave geboekt worden met een categorie naar keuze.</p>
      ${matchCount>0 ? `<button class="btn btn-primary" style="margin-bottom:10px;" onclick="confirmAllCodaMatches()">Bevestig alle ${matchCount} voorgestelde lidgeld-koppeling(en)</button>` : ''}
      <div class="table-scroll"><table><thead><tr><th>Datum</th><th>Bedrag</th><th>Mededeling</th><th>Boeken</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
  `;
}

/* ---------- Mollie-betalingen controleren (server-side call via de gekoppelde Cloudflare Worker) ---------- */
function molliePendingMembers(){
  return members.filter(m => m.mollieId && m.molliePaymentStatus !== 'paid');
}
async function checkMolliePayments(){
  if(!settings.mollieWorkerUrl){ toast('Vul eerst een Worker-URL in bij Instellingen.'); return; }
  const pending = molliePendingMembers();
  if(pending.length===0){ toast('Geen openstaande Mollie-betalingen.'); return; }
  let paidCount = 0, errorCount = 0;
  for(const m of pending){
    try{
      const res = await fetch(`${settings.mollieWorkerUrl.replace(/\/$/,'')}/payment-status?id=${encodeURIComponent(m.mollieId)}`);
      if(!res.ok) throw new Error('bad status');
      const data = await res.json();
      const key = `mollie:${m.mollieId}`;
      if(data.status === 'paid' && !ledger.some(e=>e.codaKey===key)){
        m.paidThisYear = true;
        m.molliePaymentStatus = 'paid';
        ledger.push({ id: Date.now()+paidCount, datum: (data.paidAt||todayStr()).slice(0,10), omschrijving: `Lidgeld ${m.naam} (Mollie)`, categorie:'Lidgeld', bedrag: m.bedrag, type:'in', afdeling: m.afdeling||'', isTest: !!m.isTest, ogmRaw: null, codaKey: key });
        paidCount++;
      } else if(data.status && data.status !== m.molliePaymentStatus){
        m.molliePaymentStatus = data.status;
      }
    }catch(e){ errorCount++; }
  }
  if(paidCount>0){ await saveMembers(); await saveLedger(); render(); }
  toast(`${paidCount} Mollie-betaling(en) bevestigd en geboekt.${errorCount?` ${errorCount} kon(den) niet gecontroleerd worden.`:''}`);
}
function renderMollieCheck(){
  if(!settings.mollieEnabled || !settings.mollieWorkerUrl) return '';
  const pending = molliePendingMembers();
  return `
    <div class="card">
      <h3 class="card-title">Mollie-betalingen controleren</h3>
      <p class="muted">Voor leden die via de inschrijvingspagina met Mollie betaalden maar niet zijn teruggekeerd naar de bevestigingspagina. ${pending.length>0 ? `${pending.length} nog te controleren.` : 'Alles is up-to-date.'}</p>
      <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="checkMolliePayments()" ${pending.length===0?'disabled':''}>Controleer nu</button>
    </div>
  `;
}

/* ---------- Boekhouding ---------- */
async function uploadAttachment(file, keyHint){
  if(!window.__storage) throw new Error('Opslag niet klaar');
  const { storage, storageRef, uploadBytes, getDownloadURL } = window.__storage;
  const path = `bijlagen/${keyHint}-${Date.now()}-${slug(file.name)}`;
  const r = storageRef(storage, path);
  await uploadBytes(r, file);
  const url = await getDownloadURL(r);
  return { url, name: file.name, type: file.type };
}

function renderBoekhouding(){
  const el = document.getElementById('section-boekhouding');
  const sorted = [...ledger].sort((a,b)=> b.datum.localeCompare(a.datum)).filter(e=> !boekhoudingAfdelingFilter || (e.afdeling||'')===boekhoudingAfdelingFilter);
  const realBalance = ledger.filter(e=>!e.isTest).reduce((s,e)=> s + (e.type==='in'? e.bedrag : -e.bedrag), 0);
  const testEntries = ledger.filter(e=>e.isTest);
  const testNet = testEntries.reduce((s,e)=> s + (e.type==='in'? e.bedrag : -e.bedrag), 0);
  el.innerHTML = `
    <div class="card">
      <h3 class="card-title">Rekeninguittreksel importeren</h3>
      <p class="muted">Vraag bij je bank een <b>CODA-bestand</b> (.coda) van je rekeninguittreksels op — dat is het gestandaardiseerde formaat dat alle Belgische banken aanbieden, en waarin de gestructureerde mededeling herkenbaar staat. Chirokas leest alle inkomsten en uitgaven uit het bestand, stelt automatisch een koppeling voor bij lidgeld van leden die nog moeten betalen, en laat elke andere verrichting boeken als gewone inkomst of uitgave met een categorie naar keuze — telkens pas na jouw bevestiging.</p>
      <input id="coda-file" type="file" accept=".coda,.txt" style="margin-top:8px;" onchange="handleCodaImport(event)">
      <div id="coda-status" class="muted" style="margin-top:8px;"></div>
    </div>
    ${renderCodaReview()}
    ${renderMollieCheck()}
    <div class="card">
      <h3 class="card-title">Nieuwe boeking</h3>
      <div class="row2">
        <div class="field"><label>Type</label>
          <select id="lg-type" onchange="fillLgCats()">
            <option value="in">Inkomst</option>
            <option value="out">Uitgave</option>
          </select>
        </div>
        <div class="field"><label>Datum</label><input id="lg-datum" type="date" value="${todayStr()}"></div>
      </div>
      <div class="field"><label>Omschrijving</label><input id="lg-omschrijving" type="text" placeholder="bv. Aankoop knutselmateriaal"></div>
      <div class="row2">
        <div class="field"><label>Categorie</label><select id="lg-categorie"></select></div>
        <div class="field"><label>Bedrag</label><input id="lg-bedrag" type="number" step="0.01" placeholder="0.00"></div>
      </div>
      <div class="field"><label>Afdeling (optioneel)</label><select id="lg-afdeling">${afdelingOptions('')}</select></div>
      <div class="field"><label>Bijlage — foto of PDF (optioneel)</label><input id="lg-bijlage" type="file" accept="image/*,.pdf"></div>
      <button class="btn btn-primary btn-block" onclick="addLedgerEntry()">Boeking toevoegen</button>
    </div>
    <div class="card">
      <h3 class="card-title">Alle boekingen</h3>
      <p class="muted" style="margin-bottom:10px;">Echt saldo (telt mee in Overzicht): <b class="tnum" style="color:var(--ink);">${euro(realBalance)}</b>${testEntries.length>0 ? ` · <span style="color:#8A6D1D;">waarvan ${euro(testNet)} in ${testEntries.length} testboeking(en) hieronder niet meegerekend</span>` : ''}</p>
      <div class="field" style="max-width:280px;"><label>Filter op afdeling (enkel de lijst hieronder)</label>
        <select id="boekhouding-afdeling-filter" onchange="toggleBoekhoudingAfdelingFilter()">
          <option value="" ${!boekhoudingAfdelingFilter?'selected':''}>Alle afdelingen</option>
          ${AFDELINGEN.map(a=>`<option value="${a}" ${boekhoudingAfdelingFilter===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </div>
      ${sorted.length===0 ? `<p class="empty">${boekhoudingAfdelingFilter ? 'Geen boekingen voor deze afdeling.' : 'Nog geen boekingen.'}</p>` :
        `<div class="table-scroll"><table><thead><tr><th>Datum</th><th>Omschrijving</th><th>Categorie</th><th>Afdeling</th><th style="text-align:right;">Bedrag</th><th>Bijlage</th><th></th></tr></thead><tbody>
        ${sorted.map(e=>`<tr><td class="tnum" onclick="openLedgerDetail(${e.id})" style="cursor:pointer;" title="Klik voor details">${e.datum}</td><td onclick="openLedgerDetail(${e.id})" style="cursor:pointer;" title="Klik voor details">${escapeHtml(e.omschrijving)} ${e.isTest?'<span class="pill test">Test</span>':''}</td><td><span class="cat-tag">${escapeHtml(e.categorie)}</span></td><td>${e.afdeling ? `<span class="cat-tag">${escapeHtml(e.afdeling)}</span>` : ''}</td><td style="text-align:right;" class="tnum ${e.type==='in'?'amt-in':'amt-out'}">${e.type==='in'?'+':'-'}${euro(e.bedrag)}</td><td>${e.bijlage ? '📎' : ''}</td><td><button class="del-x" onclick="removeLedgerEntry(${e.id})">✕</button></td></tr>`).join('')}
        </tbody></table></div>`}
    </div>
  `;
  fillLgCats();
}
let boekhoudingAfdelingFilter = '';
function toggleBoekhoudingAfdelingFilter(){ boekhoudingAfdelingFilter = document.getElementById('boekhouding-afdeling-filter').value; renderBoekhouding(); }
function fillLgCats(){
  const type = document.getElementById('lg-type')?.value || 'in';
  const sel = document.getElementById('lg-categorie');
  if(!sel) return;
  const cats = type==='in' ? INCOME_CATS : EXPENSE_CATS;
  sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}
async function addLedgerEntry(){
  const type = document.getElementById('lg-type').value;
  const datum = document.getElementById('lg-datum').value || todayStr();
  const omschrijving = document.getElementById('lg-omschrijving').value.trim();
  const categorie = document.getElementById('lg-categorie').value;
  const bedrag = parseFloat(document.getElementById('lg-bedrag').value);
  const afdeling = document.getElementById('lg-afdeling').value;
  const fileInput = document.getElementById('lg-bijlage');
  const file = fileInput && fileInput.files[0];
  if(!omschrijving){ toast('Geef een omschrijving in.'); return; }
  if(!bedrag || bedrag<=0){ toast('Geef een geldig bedrag in.'); return; }
  if(file && file.size > 10*1024*1024){ toast('Bijlage is te groot (max 10MB).'); return; }
  const entry = { id: Date.now(), datum, omschrijving, categorie, bedrag, type, afdeling, isTest: !!settings.testMode, bijlage: null };
  if(file){
    toast('Bijlage wordt geüpload…');
    try{ entry.bijlage = await uploadAttachment(file, entry.id); }
    catch(e){ toast('Bijlage uploaden mislukt — boeking wordt zonder bijlage opgeslagen.'); }
  }
  ledger.push(entry);
  await saveLedger();
  render();
  toast(settings.testMode ? 'Testboeking toegevoegd.' : 'Boeking toegevoegd.');
}
async function removeLedgerEntry(id){
  ledger = ledger.filter(e=>e.id!==id);
  await saveLedger();
  render();
}

/* ---------- Boeking-detail (klik op een boeking voor volledig record + bijlage) ---------- */
let ledgerDetailId = null;
function openLedgerDetail(id){
  ledgerDetailId = id;
  document.getElementById('ledger-modal').classList.add('open');
  renderLedgerDetail();
}
function closeLedgerDetail(){
  document.getElementById('ledger-modal').classList.remove('open');
  ledgerDetailId = null;
}
function renderBijlagePreview(bijlage){
  const isImg = (bijlage.type||'').startsWith('image/');
  const isPdf = (bijlage.type||'').includes('pdf') || bijlage.url.toLowerCase().endsWith('.pdf');
  let preview = '';
  if(isImg){
    preview = `<img src="${bijlage.url}" style="max-width:100%; border-radius:8px; border:1px solid var(--rope-line); display:block;">`;
  } else if(isPdf){
    preview = `<iframe src="${bijlage.url}" style="width:100%; height:380px; border:1px solid var(--rope-line); border-radius:8px;"></iframe>`;
  }
  return `${preview}<p class="muted" style="margin-top:6px;"><a href="${bijlage.url}" target="_blank" rel="noopener">${escapeHtml(bijlage.name)} — open in nieuw tabblad</a></p>`;
}
function renderLedgerDetail(){
  const e = ledger.find(x=>x.id===ledgerDetailId);
  const body = document.getElementById('ledger-modal-body');
  if(!e){ body.innerHTML = '<p class="muted">Deze boeking bestaat niet meer.</p>'; return; }
  const cats = e.type==='in' ? INCOME_CATS : EXPENSE_CATS;
  body.innerHTML = `
    <h3 style="margin-top:0;">${e.type==='in'?'Inkomst':'Uitgave'}${e.isTest?' <span class="pill test">Test</span>':''}</h3>
    <div class="field"><label>Omschrijving</label><input id="ld-omschrijving" type="text" value="${escapeHtml(e.omschrijving)}"></div>
    <div class="row2">
      <div class="field"><label>Datum</label><input id="ld-datum" type="date" value="${e.datum}"></div>
      <div class="field"><label>Bedrag</label><input id="ld-bedrag" type="number" step="0.01" value="${e.bedrag}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Categorie</label><select id="ld-categorie">${cats.map(c=>`<option value="${c}" ${e.categorie===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Afdeling</label><select id="ld-afdeling">${afdelingOptions(e.afdeling||'')}</select></div>
    </div>
    <div class="field">
      <label>Bijlage</label>
      ${e.bijlage ? renderBijlagePreview(e.bijlage) : `<p class="muted">Geen bijlage.</p>`}
      <input type="file" id="ld-bijlage-file" accept="image/*,.pdf" style="display:none" onchange="handleLedgerDetailAttach(event)">
      <div class="row2" style="margin-top:8px;">
        <button class="btn btn-ghost" onclick="document.getElementById('ld-bijlage-file').click()">${e.bijlage?'Vervang bijlage':'Bijlage toevoegen'}</button>
        ${e.bijlage ? `<button class="btn btn-ghost" onclick="removeLedgerAttachment()">Verwijder bijlage</button>` : '<span></span>'}
      </div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="saveLedgerDetail()">Opslaan</button>
    <button class="btn btn-danger btn-block" style="margin-top:8px;" onclick="deleteLedgerFromDetail()">Boeking verwijderen</button>
  `;
}
async function saveLedgerDetail(){
  const idx = ledger.findIndex(x=>x.id===ledgerDetailId);
  if(idx<0) return;
  const omschrijving = document.getElementById('ld-omschrijving').value.trim();
  const bedrag = parseFloat(document.getElementById('ld-bedrag').value);
  if(!omschrijving){ toast('Omschrijving mag niet leeg zijn.'); return; }
  if(!bedrag || bedrag<=0){ toast('Geef een geldig bedrag in.'); return; }
  ledger[idx].omschrijving = omschrijving;
  ledger[idx].datum = document.getElementById('ld-datum').value || ledger[idx].datum;
  ledger[idx].bedrag = bedrag;
  ledger[idx].categorie = document.getElementById('ld-categorie').value;
  ledger[idx].afdeling = document.getElementById('ld-afdeling').value;
  await saveLedger();
  closeLedgerDetail();
  render();
  toast('Boeking bijgewerkt.');
}
async function handleLedgerDetailAttach(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(file.size > 10*1024*1024){ toast('Bestand is te groot (max 10MB).'); return; }
  const idx = ledger.findIndex(x=>x.id===ledgerDetailId);
  if(idx<0) return;
  toast('Bijlage wordt geüpload…');
  try{
    ledger[idx].bijlage = await uploadAttachment(file, ledgerDetailId);
    await saveLedger();
    render();
    renderLedgerDetail();
    toast('Bijlage toegevoegd.');
  }catch(e){
    toast('Uploaden mislukt.');
  }
}
async function removeLedgerAttachment(){
  const idx = ledger.findIndex(x=>x.id===ledgerDetailId);
  if(idx<0) return;
  ledger[idx].bijlage = null;
  await saveLedger();
  render();
  renderLedgerDetail();
  toast('Bijlage verwijderd.');
}
async function deleteLedgerFromDetail(){
  if(!confirm('Deze boeking verwijderen?')) return;
  await removeLedgerEntry(ledgerDetailId);
  closeLedgerDetail();
}

/* ---------- Instellingen ---------- */
function renderInstellingen(){
  const el = document.getElementById('section-instellingen');
  const validIban = settings.iban ? ibanValid(settings.iban) : null;
  el.innerHTML = `
    <div class="card">
      <h3 class="card-title">Chirogegevens</h3>
      <div class="field"><label>Naam van de Chiro</label><input id="st-naam" type="text" value="${escapeHtml(settings.naam||'')}" placeholder="Chiro ..."></div>
      <div class="field"><label>Naam rekeninghouder (op de overschrijving)</label><input id="st-houder" type="text" value="${escapeHtml(settings.rekeninghouder||'')}" placeholder="Chiro ... vzw"></div>
      <div class="field"><label>IBAN rekeningnummer</label><input id="st-iban" type="text" value="${escapeHtml(settings.iban||'')}" placeholder="BE00 0000 0000 0000">
        ${validIban===true?'<div class="badge-check">✓ geldig IBAN</div>':''}
        ${validIban===false?'<div class="badge-warn">⚠ dit IBAN-nummer lijkt ongeldig</div>':''}
      </div>
      <div class="field"><label>BIC (optioneel)</label><input id="st-bic" type="text" value="${escapeHtml(settings.bic||'')}" placeholder="GEBABEBB"></div>
      <button class="btn btn-primary btn-block" onclick="saveInstellingen()">Opslaan</button>
    </div>
    <div class="card">
      <h3 class="card-title">Over betalingen ontvangen</h3>
      <p class="muted">Chirokas maakt gewone Europese overschrijvingen aan met een unieke gestructureerde mededeling per betaling — via QR-code, scanbaar met zowat elke Belgische bankapp. Dat kost niets extra: het is een gewone overschrijving, geen betaalplatform met transactiekosten. Daarnaast kan je optioneel Mollie inschakelen voor ouders die liever meteen online betalen (kleine kost per betaling — zie hieronder). Betalingen worden op "betaald" gezet zodra de leiding een QR-betaling manueel bevestigt, een rekeninguittreksel afpunt, of een Mollie-betaling automatisch bevestigd wordt.</p>
    </div>
    <div class="card">
      <h3 class="card-title">Inschrijvingspagina</h3>
      <div class="field"><label>Standaard lidgeld voor nieuwe inschrijvingen</label><input id="st-standaardlidgeld" type="number" step="0.01" value="${settings.standaardLidgeld||30}"></div>
      <div class="toggle-row">
        <div>
          <div style="font-weight:600; font-size:13.5px;">Inschrijvingen open</div>
          <p class="muted">Als dit uitstaat, toont de inschrijvingspagina een melding dat inschrijven momenteel niet mogelijk is.</p>
        </div>
        <label class="switch"><input type="checkbox" id="st-inschrijvingopen" ${settings.inschrijvingOpen!==false?'checked':''}><span class="track"></span></label>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="saveInstellingen()">Opslaan</button>
      <div class="qr-card" style="margin-top:14px;">
        <p class="muted" style="margin-bottom:6px;">Deel deze link met ouders om nieuwe leden te laten inschrijven — bv. op een poster of in een nieuwsbrief:</p>
        <div id="inschrijf-qr"></div>
        <div class="copy-box" id="inschrijf-link-box">${inschrijfLinkUrl()}</div>
        <button class="btn btn-ghost" style="margin-top:8px;" onclick="copyInschrijfLink()">Kopieer link</button>
      </div>
    </div>
    <div class="card">
      <h3 class="card-title">Online betalen via Mollie (optioneel)</h3>
      <p class="muted">Naast de gratis QR-code kan je ouders ook laten kiezen voor rechtstreeks online betalen via Mollie. Dat kost een kleine vaste vergoeding per betaling (voor Bancontact typisch €0,39 excl. btw). Dit vraagt een gratis Cloudflare Worker als tussenstap — zie MOLLIE-SETUP.md voor de volledige uitleg.</p>
      <div class="toggle-row">
        <div>
          <div style="font-weight:600; font-size:13.5px;">Mollie inschakelen</div>
          <p class="muted">Toont de "Betaal nu online"-knop op de inschrijvingspagina.</p>
        </div>
        <label class="switch"><input type="checkbox" id="st-mollieenabled" ${settings.mollieEnabled?'checked':''}><span class="track"></span></label>
      </div>
      <div class="field" style="margin-top:10px;"><label>Cloudflare Worker-URL</label><input id="st-mollieworkerurl" type="text" value="${escapeHtml(settings.mollieWorkerUrl||'')}" placeholder="https://chirokas-mollie.jouwnaam.workers.dev"></div>
      <button class="btn btn-primary btn-block" onclick="saveInstellingen()">Opslaan</button>
    </div>
    <div class="card">
      <h3 class="card-title">Testen</h3>
      <div class="toggle-row">
        <div>
          <div style="font-weight:600; font-size:13.5px;">Testmodus</div>
          <p class="muted">Nieuwe leden en boekingen worden gemarkeerd als test en tellen niet mee in het echte saldo.</p>
        </div>
        <label class="switch"><input type="checkbox" ${settings.testMode?'checked':''} onchange="toggleTestMode()"><span class="track"></span></label>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="openTestQr()">Proefbetaling proberen (QR-code testen)</button>
      <p class="muted" style="margin-top:8px;">Genereert een losse test-QR met een zelf gekozen bedrag, los van een lid — handig om te controleren of jullie bankrekening en bankapp de QR-code correct herkennen voor jullie live gaan.</p>
      ${(members.some(m=>m.isTest) || ledger.some(e=>e.isTest)) ? `<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="clearTestData()">Verwijder alleen testgegevens</button>` : ''}
    </div>
    <div class="card">
      <h3 class="card-title">Gegevens wissen</h3>
      <p class="muted">Verwijdert alle leden en boekingen voor iedereen die deze app gebruikt. Dit kan niet ongedaan gemaakt worden.</p>
      <button class="btn btn-danger" onclick="resetAll()">Alles wissen</button>
    </div>
  `;
  drawInschrijfQr();
}
function inschrijfLinkUrl(){
  return location.origin + location.pathname.replace(/[^/]*$/, '') + 'inschrijven.html';
}
function copyInschrijfLink(){
  navigator.clipboard?.writeText(inschrijfLinkUrl()).then(()=> toast('Link gekopieerd.')).catch(()=> toast('Kopiëren niet gelukt.'));
}
function drawInschrijfQr(){
  const host = document.getElementById('inschrijf-qr');
  if(!host) return;
  host.innerHTML = '';
  try{
    if(typeof QRCode === 'undefined') throw new Error('geen QR-bibliotheek');
    new QRCode(host, { text: inschrijfLinkUrl(), width:150, height:150, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){}
}
async function saveInstellingen(){
  settings.naam = document.getElementById('st-naam').value.trim();
  settings.rekeninghouder = document.getElementById('st-houder').value.trim();
  settings.iban = document.getElementById('st-iban').value.trim();
  settings.bic = document.getElementById('st-bic').value.trim();
  const stdBedrag = document.getElementById('st-standaardlidgeld');
  if(stdBedrag) settings.standaardLidgeld = parseFloat(stdBedrag.value) || 30;
  const inschrOpen = document.getElementById('st-inschrijvingopen');
  if(inschrOpen) settings.inschrijvingOpen = inschrOpen.checked;
  const mollieOn = document.getElementById('st-mollieenabled');
  if(mollieOn) settings.mollieEnabled = mollieOn.checked;
  const mollieUrl = document.getElementById('st-mollieworkerurl');
  if(mollieUrl) settings.mollieWorkerUrl = mollieUrl.value.trim();
  await saveSettings();
  render();
  toast('Instellingen opgeslagen.');
}
async function resetAll(){
  if(!confirm('Weet je zeker dat je alle leden en boekingen wil wissen voor iedereen?')) return;
  members = []; ledger = [];
  await saveMembers(); await saveLedger();
  render();
  toast('Gegevens gewist.');
}
async function clearTestData(){
  if(!confirm('Alle testleden en testboekingen verwijderen? Echte gegevens blijven staan.')) return;
  members = members.filter(m=>!m.isTest);
  ledger = ledger.filter(e=>!e.isTest);
  await saveMembers(); await saveLedger();
  render();
  toast('Testgegevens verwijderd.');
}

/* ---------- Init ---------- */
(async function init(){
  try{
    await waitForFirestore();
    await loadAll();
    render();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="loading">Kon geen verbinding maken met de database.<br>Controleer of firebaseConfig in index.html correct is ingevuld.<br><small>${escapeHtml(e.message||'')}</small></div>`;
  }
})();
</script>
