<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQDr0BuVS72KCBNMOyFSnjR3735TkpEMc",
    authDomain: "chirokas-8c1d1.firebaseapp.com",
    projectId: "chirokas-8c1d1",
    storageBucket: "chirokas-8c1d1.firebasestorage.app",
    messagingSenderId: "976970110843",
    appId: "1:976970110843:web:08a722950449e2b1bb4fde"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);
  const auth = getAuth(fbApp);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.__firestore = { doc, getDoc, setDoc, db };
      window.__firestoreReady = true;
    }
  });
  signInAnonymously(auth).catch((err) => {
    console.error('Firebase aanmelden mislukt:', err);
    window.__firestoreError = true;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
<style>
  :root{
    --paper:#FAF6EC;
    --card:#FFFDF7;
    --ink:#23301E;
    --ink-soft:#5B6455;
    --forest:#3F5B3D;
    --forest-dark:#2C4029;
    --campfire:#C1622D;
    --campfire-dark:#A34F22;
    --rope:#D8C7A1;
    --rope-line:#C9B589;
    --moss:#5C7A4B;
    --moss-bg:#E7EEE0;
    --rust:#B4472A;
    --rust-bg:#F5E4DD;
    --shadow: 0 1px 2px rgba(35,48,30,.06), 0 4px 14px rgba(35,48,30,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,48,30,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .tnum{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }

  .app{ max-width:960px; margin:0 auto; padding:0 16px 64px; }

  /* Header */
  .header{
    background:var(--forest);
    color:#F3EEDC;
    padding:22px 16px 18px;
    margin:0 -16px 18px;
    border-radius:0 0 18px 18px;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px; height:140px; border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:1;}
  .header-eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; margin:0 0 2px; }
  .header-title{ margin:0; font-size:26px; color:#fff; }
  .header-balance{ text-align:right; }
  .header-balance .amt{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:#fff; }
  .header-balance .lbl{ font-size:11px; opacity:.75; letter-spacing:.08em; text-transform:uppercase; }

  /* Nav */
  .nav{ display:flex; gap:6px; margin-bottom:20px; background:var(--rope); padding:5px; border-radius:12px; }
  .nav button{
    flex:1; border:none; background:transparent; color:var(--forest-dark);
    padding:9px 8px; border-radius:8px; font-weight:600; font-size:13.5px;
    transition:background .15s, color .15s;

  .nav button.active{ background:var(--card); color:var(--campfire-dark); box-shadow:var(--shadow); }

  .section{ display:none; animation: fadein .25s ease; }

  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* Cards */
  .card{
    background:var(--card); border:1px solid var(--rope-line); border-radius:14px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:16px;

  .card-title{ margin:0 0 4px; font-size:15px; }
  .muted{ color:var(--ink-soft); font-size:13px; margin:0; }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .stat{ background:var(--card); border:1px solid var(--rope-line); border-radius:14px; padding:14px 14px; box-shadow:var(--shadow); }
  .stat .v{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; }
  .stat .k{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .stat.income .v{ color:var(--moss); }
  .stat.expense .v{ color:var(--rust); }
  @media (max-width:560px){ .stat-grid{ grid-template-columns:1fr 1fr; } }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:9px; padding:9px 14px; font-weight:600; font-size:13.5px;
    border:1px solid transparent; transition:transform .1s, filter .1s;

  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ background:var(--campfire); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; color:var(--forest-dark); border-color:var(--rope-line); }
  .btn-ghost:hover{ background:var(--rope); }
  .btn-danger{ background:transparent; color:var(--rust); border-color:var(--rust-bg); }
  .btn-danger:hover{ background:var(--rust-bg); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }
  .btn-block{ width:100%; }

  /* Forms */

  .field{ margin-bottom:12px; }
  input[type=text], input[type=number], input[type=email], input[type=date], select, textarea{
    width:100%; padding:9px 10px; border:1px solid var(--rope-line); border-radius:8px;

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:560px){ .row2{ grid-template-columns:1fr; } }

  /* Member badge card */
  .member-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;

  .member-card.due::before{ background:var(--rust); }
  .member-name{ font-weight:600; font-size:14.5px; }
  .member-sub{ font-size:12px; color:var(--ink-soft); }
  .pill{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; letter-spacing:.02em; }
  .pill.paid{ background:var(--moss-bg); color:var(--moss); }
  .pill.due{ background:var(--rust-bg); color:var(--rust); }
  .pill.test{ background:#FDF3D8; color:#8A6D1D; }
  .member-actions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

  .test-banner{
    background:#FDF3D8; color:#8A6D1D; border:1px solid #E9D48B; border-radius:10px;
    padding:9px 12px; font-size:12.5px; font-weight:600; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .test-banner button{ background:none; border:none; color:#8A6D1D; text-decoration:underline; font-weight:700; font-size:12.5px; padding:0; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 0; }
  .switch{ position:relative; width:42px; height:24px; flex:none; }
  .switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; }
  .switch .track{ position:absolute; inset:0; background:var(--rope-line); border-radius:100px; transition:background .15s; }
  .switch .track::after{ content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .15s; }
  .switch input:checked + .track{ background:var(--campfire); }
  .switch input:checked + .track::after{ transform:translateX(18px); }

  /* Ledger table */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid var(--rope-line); }
  td{ padding:9px 8px; border-bottom:1px solid #EFE8D6; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .amt-in{ color:var(--moss); font-weight:600; }
  .amt-out{ color:var(--rust); font-weight:600; }
  .cat-tag{ font-size:11px; background:var(--rope); color:var(--forest-dark); padding:2px 8px; border-radius:100px; }
  .table-scroll{ overflow-x:auto; }
  .del-x{ background:none; border:none; color:var(--ink-soft); font-size:15px; padding:2px 6px; border-radius:6px; }
  .del-x:hover{ color:var(--rust); background:var(--rust-bg); }

  /* Modal */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(35,48,30,0.5);
    align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--paper); border-radius:16px; max-width:420px; width:100%;
    max-height:90vh; overflow-y:auto; padding:20px; position:relative;
    border:1px solid var(--rope-line);
  }
  .modal-close{ position:absolute; top:12px; right:12px; background:none; border:none; font-size:18px; color:var(--ink-soft); }
  .qr-card{
    background:#fff; border:2px dashed var(--rope-line); border-radius:14px;
    padding:16px; text-align:center; margin:14px 0;
  }
  .qr-card #qr-canvas{ display:inline-block; margin:8px auto; }
  .ogm-code{ font-family:'Work Sans',monospace; font-weight:700; letter-spacing:.03em; font-size:16px; margin-top:6px; }
  .copy-box{ background:#fff; border:1px solid var(--rope-line); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap; margin-top:10px; }

  .empty{ text-align:center; padding:26px 10px; color:var(--ink-soft); }
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--forest); color:#fff; padding:10px 18px; border-radius:100px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:80;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .badge-check{ color:var(--moss); font-weight:700; font-size:12px; }
  .badge-warn{ color:var(--rust); font-weight:700; font-size:12px; }
  .loading{ text-align:center; padding:60px 10px; color:var(--ink-soft); }
  .footnote{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:24px; line-height:1.5; }
</style>

<div class="app" id="app">
  <div class="loading" id="loading">Chirokas wordt geladen…</div>
</div>

<div class="modal-backdrop" id="qr-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeQrModal()">✕</button>
    <h3 style="margin-top:0;">Betaalverzoek</h3>
    <div id="qr-modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Storage helpers (Firestore) ---------- */
let settings = { naam:'', iban:'', bic:'', rekeninghouder:'', nextRef: 1 };
let members = [];
let ledger = [];

function waitForFirestore(){
  return new Promise((resolve, reject)=>{
    if(window.__firestoreReady) return resolve();
    const iv = setInterval(()=>{
      if(window.__firestoreReady){ clearInterval(iv); resolve(); }
      if(window.__firestoreError){ clearInterval(iv); reject(new Error('Firebase-aanmelding mislukt')); }
    }, 40);
    setTimeout(()=>{ clearInterval(iv); reject(new Error('Firebase reageerde niet op tijd — controleer je firebaseConfig.')); }, 12000);
  });
}

async function loadAll(){
  const { doc, getDoc, db } = window.__firestore;
  try{
    const s = await getDoc(doc(db,'chirokas','settings'));
    if(s.exists()) settings = { ...settings, ...s.data() };
  }catch(e){}
  try{
    const m = await getDoc(doc(db,'chirokas','members'));
    if(m.exists()) members = m.data().list || [];
  }catch(e){}
  try{
    const l = await getDoc(doc(db,'chirokas','ledger'));
    if(l.exists()) ledger = l.data().list || [];
  }catch(e){}
}
async function saveSettings(){
  try{ const { doc, setDoc, db } = window.__firestore; await setDoc(doc(db,'chirokas','settings'), settings); }
  catch(e){ toast('Opslaan mislukt, probeer opnieuw.'); }
}
async function saveMembers(){
  try{ const { doc, setDoc, db } = window.__firestore; await setDoc(doc(db,'chirokas','members'), { list: members }); }
  catch(e){ toast('Opslaan mislukt, probeer opnieuw.'); }
}
async function saveLedger(){
  try{ const { doc, setDoc, db } = window.__firestore; await setDoc(doc(db,'chirokas','ledger'), { list: ledger }); }
  catch(e){ toast('Opslaan mislukt, probeer opnieuw.'); }
}

/* ---------- Belgian OGM (gestructureerde mededeling) ---------- */
function generateOGM(){
  const seq = settings.nextRef || 1;
  const base = String(seq).padStart(10,'0');
  let rem = parseInt(base,10) % 97;
  if(rem===0) rem = 97;
  const checksum = String(rem).padStart(2,'0');
  const full = base + checksum;
  const formatted = `+++${full.slice(0,3)}/${full.slice(3,7)}/${full.slice(7,12)}+++`;
  return { raw: full, formatted };
}

/* ---------- IBAN mod-97 check (ISO 7064) ---------- */
function ibanValid(iban){
  const clean = (iban||'').replace(/\s+/g,'').toUpperCase();
  if(clean.length < 15 || !/^[A-Z]{2}[0-9A-Z]+$/.test(clean)) return false;
  const rearr = clean.slice(4) + clean.slice(0,4);
  let numStr = '';
  for(const ch of rearr){
    if(/[0-9]/.test(ch)) numStr += ch;
    else numStr += (ch.charCodeAt(0) - 55).toString();
  }
  let rem = 0;
  for(const d of numStr){ rem = (rem*10 + parseInt(d,10)) % 97; }
  return rem === 1;
}

/* ---------- EPC QR payload ---------- */
function buildEpcPayload(amount, ogmRaw){
  const iban = (settings.iban||'').replace(/\s+/g,'').toUpperCase();
  const name = (settings.rekeninghouder || settings.naam || '').slice(0,70);
  const amt = 'EUR' + Number(amount).toFixed(2);
  const lines = ['BCD','002','1','SCT', settings.bic ? settings.bic.replace(/\s+/g,'').toUpperCase() : '', name, iban, amt, '', ogmRaw, ''];
  return lines.join('\n');
}

/* ---------- Formatting ---------- */
function euro(n){ return '€ ' + Number(n||0).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ---------- Categories ---------- */
const INCOME_CATS = ['Lidgeld','Kampinschrijving','Activiteiten','Subsidies','Giften','Overige inkomsten'];
const EXPENSE_CATS = ['Materiaal','Kamp','Verzekering','Lokalen','Vorming leiding','Eten & drank','Overige kosten'];

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- State ---------- */
let activeTab = 'dashboard';

function setTab(tab){ activeTab = tab; render(); }

/* ---------- Render root ---------- */
function render(){
  const app = document.getElementById('app');
  const balance = ledger.filter(e=>!e.isTest).reduce((s,e)=> s + (e.type==='in'? e.bedrag : -e.bedrag), 0);
  app.innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <p class="header-eyebrow">Chirokas</p>
          <h1 class="header-title">${settings.naam ? escapeHtml(settings.naam) : 'Jouw Chiro'}</h1>
        </div>
        <div class="header-balance">
          <div class="amt tnum">${euro(balance)}</div>
          <div class="lbl">huidig saldo</div>
        </div>
      </div>
    </div>
    ${settings.testMode ? `<div class="test-banner"><span>🧪 Testmodus actief — nieuwe leden en boekingen worden gemarkeerd als test en tellen niet mee in het echte saldo.</span><button onclick="toggleTestMode()">Zet uit</button></div>` : ''}
    <div class="nav">
      <button data-tab="dashboard" class="${activeTab==='dashboard'?'active':''}">Overzicht</button>
      <button data-tab="leden" class="${activeTab==='leden'?'active':''}">Leden</button>
      <button data-tab="boekhouding" class="${activeTab==='boekhouding'?'active':''}">Boekhouding</button>
      <button data-tab="mailing" class="${activeTab==='mailing'?'active':''}">Mailing</button>
      <button data-tab="instellingen" class="${activeTab==='instellingen'?'active':''}">Instellingen</button>
    </div>
    <div id="section-dashboard" class="section ${activeTab==='dashboard'?'active':''}"></div>
    <div id="section-leden" class="section ${activeTab==='leden'?'active':''}"></div>
    <div id="section-boekhouding" class="section ${activeTab==='boekhouding'?'active':''}"></div>
    <div id="section-mailing" class="section ${activeTab==='mailing'?'active':''}"></div>
    <div id="section-instellingen" class="section ${activeTab==='instellingen'?'active':''}"></div>
    <p class="footnote">Gegevens van Chirokas worden gedeeld tussen alle leiding die deze app opent — iedereen ziet en bewerkt dezelfde ledenlijst en boekhouding.</p>
  `;
  app.querySelectorAll('.nav button').forEach(b=> b.onclick = ()=> setTab(b.dataset.tab));
  renderDashboard();
  renderLeden();
  renderBoekhouding();
  renderMailing();
  renderInstellingen();
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

async function toggleTestMode(){
  settings.testMode = !settings.testMode;
  await saveSettings();
  render();
  toast(settings.testMode ? 'Testmodus aan.' : 'Testmodus uit.');
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const el = document.getElementById('section-dashboard');
  const year = new Date().getFullYear();
  const real = ledger.filter(e=>!e.isTest);
  const thisYear = real.filter(e=> e.datum.slice(0,4)===String(year));
  const inc = thisYear.filter(e=>e.type==='in').reduce((s,e)=>s+e.bedrag,0);
  const exp = thisYear.filter(e=>e.type==='out').reduce((s,e)=>s+e.bedrag,0);
  const openstaand = members.filter(m=>!m.paidThisYear && !m.isTest).length;
  const recent = [...real].sort((a,b)=> b.datum.localeCompare(a.datum)).slice(0,6);

  const testEntries = ledger.filter(e=>e.isTest);
  const testMembers = members.filter(m=>m.isTest);
  const testNet = testEntries.reduce((s,e)=> s + (e.type==='in'? e.bedrag : -e.bedrag), 0);

  el.innerHTML = `
    ${(testEntries.length>0 || testMembers.length>0) ? `<div class="test-banner"><span>🧪 ${testMembers.length} testlid/leden en ${testEntries.length} testboeking(en) (samen ${euro(testNet)}) tellen hier bewust niet mee. Te zien in "Boekhouding" en "Leden", op te ruimen bij "Instellingen".</span></div>` : ''}
    <div class="stat-grid">
      <div class="stat income"><div class="v tnum">${euro(inc)}</div><div class="k">Inkomsten ${year}</div></div>
      <div class="stat expense"><div class="v tnum">${euro(exp)}</div><div class="k">Uitgaven ${year}</div></div>
      <div class="stat"><div class="v tnum">${openstaand}</div><div class="k">Openstaande lidgelden</div></div>
    </div>
    <div class="card">
      <h3 class="card-title">Recente bewegingen</h3>
      ${recent.length===0 ? `<p class="empty">Nog geen boekingen. Voeg leden toe of registreer een uitgave in "Boekhouding".</p>` :
        `<div class="table-scroll"><table><thead><tr><th>Datum</th><th>Omschrijving</th><th>Categorie</th><th style="text-align:right;">Bedrag</th></tr></thead><tbody>

/* ---------- Excel import ---------- */
function findKey(row, patterns){
  const keys = Object.keys(row);
  for(const p of patterns){
    const hit = keys.find(k => p.test(k.trim()));
    if(hit) return hit;
  }
  return null;
}
async function handleExcelImport(evt){
  const file = evt.target.files[0];
  const status = document.getElementById('xl-status');
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    status.textContent = 'Excel-bibliotheek kon niet geladen worden. Probeer opnieuw of controleer je internetverbinding.';
    return;
  }
  status.textContent = 'Bestand wordt ingelezen…';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    if(rows.length === 0){ status.textContent = 'Geen rijen gevonden in dit bestand.'; return; }

    let added = 0, updated = 0, skipped = 0;
    for(const row of rows){
      const naamKey = findKey(row, [/^naam$/i, /name/i]);
      const bedragKey = findKey(row, [/lidgeld/i, /bedrag/i, /prijs/i, /amount/i]);
      const emailKey = findKey(row, [/e-?mail/i]);
      const naam = naamKey ? String(row[naamKey]).trim() : '';
      if(!naam){ skipped++; continue; }
      let bedrag = bedragKey ? parseFloat(String(row[bedragKey]).replace(',', '.')) : NaN;
      if(isNaN(bedrag) || bedrag < 0) bedrag = 0;
      const email = emailKey ? String(row[emailKey]).trim() : '';

      const existing = members.findIndex(m => m.naam.trim().toLowerCase() === naam.toLowerCase());
      if(existing >= 0){
        members[existing].bedrag = bedrag || members[existing].bedrag;
        if(email) members[existing].email = email;
        updated++;
      }else{
        members.push({ naam, bedrag, email, paidThisYear:false, isTest: !!settings.testMode });
        added++;
      }
    }
    await saveMembers();
    render();
    let msg = `${added} lid/leden toegevoegd, ${updated} bijgewerkt.`;
    if(skipped) msg += ` ${skipped} rij(en) zonder naam overgeslagen.`;
    toast(msg);
    document.getElementById('xl-status') && (document.getElementById('xl-status').textContent = msg);
  }catch(e){
    status.textContent = 'Kon dit bestand niet inlezen. Controleer of het een geldig Excel- of CSV-bestand is.';
  }
  evt.target.value = '';
}

async function downloadMemberQr(i){
  const m = members[i];
  if(!settings.iban || !ibanValid(settings.iban)){ toast('Vul eerst een geldig IBAN in bij Instellingen.'); return; }
  if(typeof QRCode === 'undefined'){ toast('QR-bibliotheek niet geladen.'); return; }
  const ogm = generateOGM();
  const payload = buildEpcPayload(m.bedrag, ogm.raw);
  const hidden = document.createElement('div');
  hidden.style.position='fixed'; hidden.style.left='-9999px';
  document.body.appendChild(hidden);
  try{
    new QRCode(hidden, { text: payload, width:300, height:300, correctLevel: QRCode.CorrectLevel.M });
    const img = hidden.querySelector('img');
    const canvas = hidden.querySelector('canvas');
    const dataUrl = img && img.src ? img.src : (canvas ? canvas.toDataURL('image/png') : null);
    if(!dataUrl) throw new Error('geen QR gegenereerd');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `betaal-qr-${slug(m.naam)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    toast('QR-code kon niet gedownload worden.');
  }
  document.body.removeChild(hidden);
  settings.nextRef = (settings.nextRef||1) + 1;
  await saveSettings();
}

async function openMailDraft(i){
  const m = members[i];
  if(!settings.iban || !ibanValid(settings.iban)){ toast('Vul eerst een geldig IBAN in bij Instellingen.'); return; }
  if(!m.email){ toast('Dit lid heeft geen e-mailadres.'); return; }
  const ogm = generateOGM();
  const chiroNaam = settings.naam || 'de Chiro';
  const subject = `Lidgeld ${chiroNaam} — ${m.naam}`;
  const body = `Beste,\n\nGraag ontvangen we het lidgeld voor ${m.naam}.\n\nBedrag: ${euro(m.bedrag)}\nRekeningnummer: ${settings.iban}\nMededeling: ${ogm.formatted}\n\nJe kan overschrijven met bovenstaande gegevens, of de meegestuurde QR-code scannen met je bankapp voor een automatisch ingevulde overschrijving.\n\nAlvast bedankt!\n${chiroNaam}`;
  const mailUrl = `mailto:${m.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailUrl;
  settings.nextRef = (settings.nextRef||1) + 1;

  setTimeout(()=>{ if(confirm(`Mail geopend voor ${m.naam}. Markeren als verstuurd?`)) markMailSent(i); }, 800);

async function generateQr(ogmRaw, ogmFormatted){
  const amount = parseFloat(document.getElementById('qr-bedrag').value);

  const payload = buildEpcPayload(amount, ogmRaw);
  const out = document.getElementById('qr-output');
  out.innerHTML = `

      <div id="qr-canvas"></div>
      <div class="ogm-code">${ogmFormatted}</div>

Rekeningnummer: ${settings.iban}
Mededeling: ${ogmFormatted}</div>
    <div class="row2" style="margin-top:10px;">

    new QRCode(qrHost, { text: payload, width:180, height:180, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){
    qrHost.innerHTML = '<p class="muted">QR-code kon niet geladen worden — gebruik de mededeling en rekeninggegevens hieronder om manueel over te schrijven.</p>';
  }
  settings.nextRef = (settings.nextRef||1) + 1;
  await saveSettings();
}

function copyPaymentText(){
  const txt = document.getElementById('copy-text').innerText;
  navigator.clipboard?.writeText(txt).then(()=> toast('Tekst gekopieerd.')).catch(()=> toast('Kopiëren niet gelukt.'));

async function markPaid(i, amount, ogmFormatted){

async function resetAll(){
  if(!confirm('Weet je zeker dat je alle leden en boekingen wil wissen voor iedereen?')) return;
  members = []; ledger = [];
  await saveMembers(); await saveLedger();
  render();
  toast('Gegevens gewist.');
}
async function clearTestData(){
  if(!confirm('Alle testleden en testboekingen verwijderen? Echte gegevens blijven staan.')) return;
  members = members.filter(m=>!m.isTest);
  ledger = ledger.filter(e=>!e.isTest);
  await saveMembers(); await saveLedger();
  render();
  toast('Testgegevens verwijderd.');
}

/* ---------- Init ---------- */
(async function init(){
  try{
    await waitForFirestore();
    await loadAll();
    render();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="loading">Kon geen verbinding maken met de database.<br>Controleer of firebaseConfig in index.html correct is ingevuld.<br><small>${escapeHtml(e.message||'')}</small></div>`;
  }
})();
</script>
