    authDomain: "chirokas-8c1d1.firebaseapp.com",
    projectId: "chirokas-8c1d1",
    storageBucket: "chirokas-8c1d1.firebasestorage.app",
    messagingSenderId: "976970110843",
    appId: "1:976970110843:web:08a722950449e2b1bb4fde"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);

  onAuthStateChanged(auth, (user) => {

<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">Bezig met laden…</div>
</div>
<div class="toast" id="toast"></div>

<script>
let settings = { naam:'', iban:'', bic:'', rekeninghouder:'', nextRef:1, standaardLidgeld:50, inschrijvingOpen:true, mollieEnabled:false, mollieWorkerUrl:'' };
let members = [];
const AFDELINGEN = ['Pagatters','Speelclub jongens','Speelclub meisjes','Rakkers','Kwiks','Tippers','Toppers','Kerels','Tiptiens','Aspi jongens','Aspi meisjes','Leiding'];

function waitForFirestore(){
  return new Promise((resolve, reject)=>{
    if(window.__firestoreReady) return resolve();
    const iv = setInterval(()=>{
      if(window.__firestoreReady){ clearInterval(iv); resolve(); }
      if(window.__firestoreError){ clearInterval(iv); reject(new Error('Firebase-aanmelding mislukt')); }
    }, 40);
    setTimeout(()=>{ clearInterval(iv); reject(new Error('Kon geen verbinding maken.')); }, 12000);
  });
}
async function loadAll(){
  const { doc, getDoc, db } = window.__firestore;
  try{ const s = await getDoc(doc(db,'chirokas','settings')); if(s.exists()) settings = { ...settings, ...s.data() }; }catch(e){}
  try{ const m = await getDoc(doc(db,'chirokas','members')); if(m.exists()) members = m.data().list || []; }catch(e){}
  let changed = false;
  members.forEach((m,idx)=>{ if(!m.id){ m.id = Date.now()+idx; changed = true; } });
  if(changed) await saveMembers();
}
async function saveMembers(){
  const { doc, setDoc, db } = window.__firestore;
  await setDoc(doc(db,'chirokas','members'), { list: members });
}
async function saveSettings(){
  const { doc, setDoc, db } = window.__firestore;
  await setDoc(doc(db,'chirokas','settings'), settings);
}

/* ---------- OGM / IBAN / QR — zelfde logica als index.html ---------- */
function generateOGM(){
  const seq = settings.nextRef || 1;
  const base = String(seq).padStart(10,'0');
  let rem = parseInt(base,10) % 97;
  if(rem===0) rem = 97;
  const checksum = String(rem).padStart(2,'0');
  const full = base + checksum;
  const formatted = `+++${full.slice(0,3)}/${full.slice(3,7)}/${full.slice(7,12)}+++`;
  return { raw: full, formatted };
}
function ibanValid(iban){
  const clean = (iban||'').replace(/\s+/g,'').toUpperCase();
  if(clean.length < 15 || !/^[A-Z]{2}[0-9A-Z]+$/.test(clean)) return false;
  const rearr = clean.slice(4) + clean.slice(0,4);
  let numStr = '';
  for(const ch of rearr){ numStr += /[0-9]/.test(ch) ? ch : (ch.charCodeAt(0)-55).toString(); }
  let rem = 0;
  for(const d of numStr){ rem = (rem*10 + parseInt(d,10)) % 97; }
  return rem === 1;
}
function buildEpcPayload(amount, ogmRaw){
  const iban = (settings.iban||'').replace(/\s+/g,'').toUpperCase();
  const name = (settings.rekeninghouder || settings.naam || '').slice(0,70);
  const amt = 'EUR' + Number(amount).toFixed(2);
  return ['BCD','002','1','SCT', settings.bic ? settings.bic.replace(/\s+/g,'').toUpperCase() : '', name, iban, amt, '', ogmRaw, ''].join('\n');
}
function euro(n){ return '€ ' + Number(n||0).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- Naam-matching (normalisatie + Levenshtein) ---------- */
function normalizeName(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const d = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      d[i][j] = a[i-1]===b[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j], d[i][j-1], d[i-1][j-1]);
    }
  }
  return d[m][n];
}
function findMatches(voornaam, achternaam, geboortedatum){
  const naam = `${voornaam} ${achternaam}`.trim();
  const norm = normalizeName(naam);
  if(!norm) return { exact:null, fuzzy:[] };
  let exact = null;
  const fuzzy = [];
  for(const m of members){
    const mNorm = normalizeName(m.naam);
    const sameDate = geboortedatum && m.geboortedatum && geboortedatum===m.geboortedatum;
    if(mNorm===norm && sameDate){ exact = m; continue; }
    if(mNorm===norm && geboortedatum && !m.geboortedatum){ exact = m; continue; }
    const dist = levenshtein(mNorm, norm);
    const closeName = dist <= 2 && mNorm.length>0;
    if((closeName && sameDate) || (mNorm===norm && !sameDate)){
      fuzzy.push(m);
    }
  }
  return { exact, fuzzy };
}

/* ---------- State ---------- */
let matchResult = { exact:null, fuzzy:[] };
let confirmedMatch = null; // member object once user confirms "ja, dat ben ik" or exact match found
let dupIgnored = false;    // user said "nee, nieuw lid" on a fuzzy suggestion

function fromApp(){ return new URLSearchParams(location.search).get('van') === 'app'; }
function backLinkHtml(){
  return fromApp() ? `<p style="text-align:center; margin:-8px 0 16px;"><a href="index.html" style="color:var(--forest-dark); font-weight:600; font-size:13px; text-decoration:none;">← Terug naar Chirokas</a></p>` : '';
}

function render(){
  const app = document.getElementById('app');
  const urlParams = new URLSearchParams(location.search);
  const isMollieReturn = urlParams.get('molliereturn')==='1' && urlParams.get('memberId');
  if(isMollieReturn){
    renderMollieReturn(parseInt(urlParams.get('memberId'),10));
    return;
  }
  if(settings.inschrijvingOpen===false){
    app.innerHTML = `
      <div class="header"><p>Inschrijven</p><h1>${settings.naam?escapeHtml(settings.naam):'Inschrijven'}</h1></div>
      ${backLinkHtml()}
      <div class="card"><div class="banner closed">Inschrijvingen zijn momenteel gesloten. Neem contact op met de leiding als je toch wil inschrijven.</div></div>
    `;
    return;
  }
  app.innerHTML = `
    <div class="header"><p>Inschrijven</p><h1>${settings.naam?escapeHtml(settings.naam):'Inschrijven'}</h1></div>
    ${backLinkHtml()}
    <div class="card">
      <h3 style="margin-top:0;">Gegevens lid</h3>
      <div class="row2">
        <div class="field"><label>Voornaam lid *</label><input id="rf-voornaam" type="text"></div>
        <div class="field"><label>Achternaam lid *</label><input id="rf-achternaam" type="text"></div>
      </div>
      <div class="field"><label>Gender *</label><input id="rf-gender" type="text"></div>
      <div class="field"><label>Geboortedatum lid *</label><input id="rf-geboortedatum" type="date"></div>
      <div id="match-banner"></div>
      <div class="field"><label>Groep (selecteer) *</label><select id="rf-afdeling">${AFDELINGEN.map(a=>`<option value="${a}">${a}</option>`).join('')}</select></div>
      <div class="field"><label>Straat + huisnummer *</label><input id="rf-straat" type="text"></div>
      <div class="row2">
        <div class="field"><label>Postcode *</label><input id="rf-postcode" type="text"></div>
        <div class="field"><label>Gemeente *</label><input id="rf-gemeente" type="text"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Gsm ouder *</label><input id="rf-gsm" type="tel"></div>
        <div class="field"><label>Gsm ouder (2)</label><input id="rf-gsm2" type="tel"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Mail ouder *</label><input id="rf-email" type="email"></div>
        <div class="field"><label>Mail ouder (2)</label><input id="rf-email2" type="email"></div>
      </div>
      <div class="field"><label>Gsm lid</label><input id="rf-gsmlid" type="tel"></div>
      <div class="field"><label>Lidgeld</label><p style="margin:0; padding:10px 11px; font-size:15px;">${euro(settings.standaardLidgeld||50)}</p></div>
      <div class="field">
        <label>Toestemming foto *</label>
        <label style="display:flex; align-items:flex-start; gap:10px; font-weight:400; color:var(--ink); margin:8px 0;"><input type="radio" name="rf-fotoconsent" value="ja" style="width:22px; height:22px; flex:none; accent-color:var(--campfire); margin-top:1px;"> Ik geef toestemming om foto's van mij/mijn kind op de website/facebookpagina/instagram van onze chiro te plaatsen.</label>
        <label style="display:flex; align-items:flex-start; gap:10px; font-weight:400; color:var(--ink); margin:8px 0;"><input type="radio" name="rf-fotoconsent" value="nee" style="width:22px; height:22px; flex:none; accent-color:var(--campfire); margin-top:1px;"> Ik geef GEEN toestemming om foto's van mij/mijn kind op de website/facebookpagina/instagram van onze chiro te plaatsen.</label>
      </div>
      <button class="btn btn-primary" onclick="submitInschrijving()">Inschrijven</button>
    </div>
    <p class="muted" style="text-align:center;">Gegevens worden bewaard bij ${settings.naam||'de Chiro'} voor ledenadministratie en boekhouding.</p>
  `;
  ['rf-voornaam','rf-achternaam','rf-geboortedatum'].forEach(id=>{
    document.getElementById(id).addEventListener('blur', checkForMatch);
  });
}

function checkForMatch(){
  const voornaam = document.getElementById('rf-voornaam').value.trim();
  const achternaam = document.getElementById('rf-achternaam').value.trim();
  const geboortedatum = document.getElementById('rf-geboortedatum').value;
  if(!voornaam || !achternaam){ return; }
  matchResult = findMatches(voornaam, achternaam, geboortedatum);
  confirmedMatch = matchResult.exact || null;
  dupIgnored = false;
  renderMatchBanner();
  if(confirmedMatch) prefillFromMember(confirmedMatch);
}

function renderMatchBanner(){
  const el = document.getElementById('match-banner');
  if(!el) return;
  if(matchResult.exact){
    el.innerHTML = `<div class="banner found">We vonden een bestaand lid met deze naam en geboortedatum — de gegevens hieronder zijn al ingevuld. Klopt er iets niet meer? Pas het gerust aan.</div>`;
  } else if(matchResult.fuzzy.length>0 && !dupIgnored){
    el.innerHTML = `<div class="banner maybe">Gelijkaardig(e) lid/leden gevonden: <b>${matchResult.fuzzy.map(m=>escapeHtml(m.naam)).join(', ')}</b>. Is dit hetzelfde lid?
      <br>
      <button onclick="confirmFuzzyMatch(${matchResult.fuzzy[0].id})">Ja, dat ben ik</button>
      <button onclick="declineFuzzyMatch()">Nee, nieuw lid</button>
    </div>`;
  } else {
    el.innerHTML = '';
  }
}
function confirmFuzzyMatch(id){
  const m = members.find(x=>x.id===id);
  if(!m) return;
  confirmedMatch = m;
  dupIgnored = false;
  renderMatchBanner();
  prefillFromMember(m);
  toast('Gegevens overgenomen.');
}
function declineFuzzyMatch(){
  confirmedMatch = null;
  dupIgnored = true;
  renderMatchBanner();
}
function prefillFromMember(m){
  document.getElementById('rf-voornaam').value = m.naam.split(' ')[0]||'';
  document.getElementById('rf-achternaam').value = m.naam.split(' ').slice(1).join(' ')||'';
  if(m.gender) document.getElementById('rf-gender').value = m.gender;
  if(m.geboortedatum) document.getElementById('rf-geboortedatum').value = m.geboortedatum;
  if(m.afdeling) document.getElementById('rf-afdeling').value = m.afdeling;
  if(m.straatHuisnummer) document.getElementById('rf-straat').value = m.straatHuisnummer;
  if(m.postcode) document.getElementById('rf-postcode').value = m.postcode;
  if(m.gemeente) document.getElementById('rf-gemeente').value = m.gemeente;
  if(m.gsm) document.getElementById('rf-gsm').value = m.gsm;
  if(m.gsm2) document.getElementById('rf-gsm2').value = m.gsm2;
  if(m.email) document.getElementById('rf-email').value = m.email;
  if(m.email2) document.getElementById('rf-email2').value = m.email2;
  if(m.gsmLid) document.getElementById('rf-gsmlid').value = m.gsmLid;
  if(m.fotoToestemming===true || m.fotoToestemming===false){
    const val = m.fotoToestemming ? 'ja' : 'nee';
    const radio = document.querySelector(`input[name="rf-fotoconsent"][value="${val}"]`);
    if(radio) radio.checked = true;
  }
}

async function ensureMemberOgm(m){
  if(m.openOgm && m.openOgm.raw) return m.openOgm;
  const ogm = generateOGM();
  m.openOgm = { raw: ogm.raw, formatted: ogm.formatted };
  settings.nextRef = (settings.nextRef||1) + 1;
  return m.openOgm;
}

async function submitInschrijving(){
  const voornaam = document.getElementById('rf-voornaam').value.trim();
  const achternaam = document.getElementById('rf-achternaam').value.trim();
  const gender = document.getElementById('rf-gender').value.trim();
  const geboortedatum = document.getElementById('rf-geboortedatum').value;
  const afdeling = document.getElementById('rf-afdeling').value;
  const straatHuisnummer = document.getElementById('rf-straat').value.trim();
  const postcode = document.getElementById('rf-postcode').value.trim();
  const gemeente = document.getElementById('rf-gemeente').value.trim();
  const gsm = document.getElementById('rf-gsm').value.trim();
  const gsm2 = document.getElementById('rf-gsm2').value.trim();
  const email = document.getElementById('rf-email').value.trim();
  const email2 = document.getElementById('rf-email2').value.trim();
  const gsmLid = document.getElementById('rf-gsmlid').value.trim();
  const fotoRadio = document.querySelector('input[name="rf-fotoconsent"]:checked');
  const bedrag = settings.standaardLidgeld || 50;
  if(!voornaam || !achternaam){ toast('Vul voor- en achternaam in.'); return; }
  if(!gender){ toast('Vul gender in.'); return; }
  if(!geboortedatum){ toast('Vul de geboortedatum in.'); return; }
  if(!straatHuisnummer){ toast('Vul straat + huisnummer in.'); return; }
  if(!postcode){ toast('Vul de postcode in.'); return; }
  if(!gemeente){ toast('Vul de gemeente in.'); return; }
  if(!gsm){ toast('Vul een gsm-nummer van een ouder in.'); return; }
  if(!email){ toast('Vul een e-mailadres van een ouder in.'); return; }
  if(!fotoRadio){ toast('Duid je keuze voor toestemming foto aan.'); return; }
  const fotoToestemming = fotoRadio.value === 'ja';
  const naam = `${voornaam} ${achternaam}`.trim();

  let member;
  if(confirmedMatch){
    member = members.find(m=>m.id===confirmedMatch.id);
    member.naam = naam;
    member.gender = gender;
    member.geboortedatum = geboortedatum || member.geboortedatum || '';
    member.afdeling = afdeling;
    member.straatHuisnummer = straatHuisnummer;
    member.postcode = postcode;
    member.gemeente = gemeente;
    member.gsm = gsm;
    member.gsm2 = gsm2;
    member.email = email;
    member.email2 = email2;
    member.gsmLid = gsmLid;
    member.fotoToestemming = fotoToestemming;
    member.bedrag = bedrag;
  } else {
    member = { id: Date.now(), naam, gender, geboortedatum, afdeling, straatHuisnummer, postcode, gemeente, gsm, gsm2, email, email2, gsmLid, fotoToestemming, bedrag, paidThisYear:false, isTest:false };
    if(dupIgnored && matchResult.fuzzy.length>0){
      member.possibleDuplicateOf = matchResult.fuzzy[0].id;
      member.dupResolved = false;
    }
    members.push(member);
  }
  await ensureMemberOgm(member);
  await saveMembers();
  await saveSettings();
  renderPaymentOptions(member);
}

function renderPaymentOptions(member){
  const app = document.getElementById('app');
  const ibanOk = settings.iban && ibanValid(settings.iban);
  const bedrag = member.bedrag;
  app.innerHTML = `
    <div class="header"><p>Inschrijving ${escapeHtml(settings.naam||'Chiro')}</p><h1>Bedankt, ${escapeHtml(member.naam.split(' ')[0])}!</h1></div>
    ${backLinkHtml()}
    <div class="card">
      <p class="muted" style="margin-bottom:16px;">Inschrijving ontvangen. Nog te betalen: <b>${euro(bedrag)}</b>.</p>
      ${!ibanOk ? '<p class="muted">De Chiro heeft nog geen rekeningnummer ingesteld — de leiding neemt contact op over de betaling.</p>' : ''}
      ${ibanOk && settings.mollieEnabled && settings.mollieWorkerUrl ? `
        <button class="btn btn-primary" onclick="startMolliePayment(${member.id})">Betaal nu online (Bancontact/kaart)</button>
        <div class="divider-or">of</div>
      ` : ''}
      ${ibanOk ? `<button class="btn btn-ghost" onclick="showFreeQr(${member.id})">Betaal gratis via overschrijving (QR)</button>` : ''}
    </div>
    <div id="payment-detail"></div>
  `;
}

function showFreeQr(memberId){
  const m = members.find(x=>x.id===memberId);
  const host = document.getElementById('payment-detail');
  const ogm = m.openOgm;
  const payload = buildEpcPayload(m.bedrag, ogm.raw);
  host.innerHTML = `
    <div class="card">
      <div class="qr-card">
        <div id="qr-canvas"></div>
        <div class="ogm-code">${ogm.formatted}</div>
        <p class="muted" style="margin-top:6px;">Scan met je bankapp voor een automatisch ingevulde, gratis overschrijving.</p>
      </div>
      <div class="copy-box">Chiro-lidgeld — te betalen: ${euro(m.bedrag)}
Rekeningnummer: ${settings.iban}
Mededeling: ${ogm.formatted}</div>
    </div>
  `;
  const qrHost = document.getElementById('qr-canvas');
  try{ new QRCode(qrHost, { text: payload, width:200, height:200, correctLevel: QRCode.CorrectLevel.M }); }
  catch(e){ qrHost.innerHTML = '<p class="muted">QR-code kon niet geladen worden — gebruik de gegevens hierboven.</p>'; }
}

async function startMolliePayment(memberId){
  const m = members.find(x=>x.id===memberId);
  const host = document.getElementById('payment-detail');
  host.innerHTML = `<p class="center">Bezig met doorverbinden naar Mollie…</p>`;
  try{
    const redirectUrl = `${location.origin}${location.pathname}?molliereturn=1&memberId=${m.id}`;
    const res = await fetch(`${settings.mollieWorkerUrl.replace(/\/$/,'')}/create-payment`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        amount: m.bedrag.toFixed(2),
        description: `Lidgeld ${settings.naam||'Chiro'} — ${m.naam}`,
        redirectUrl,
        metadata: { memberId: m.id }
      })
    });
    if(!res.ok) throw new Error('mollie create-payment mislukt');
    const data = await res.json();
    m.mollieId = data.id;
    m.molliePaymentStatus = 'pending';
    await saveMembers();
    window.location.href = data.checkoutUrl;
  }catch(e){
    host.innerHTML = `<div class="card"><p class="muted">Online betalen lukte niet. Gebruik de gratis QR-code hieronder.</p></div>`;
    showFreeQr(memberId);
  }
}

async function renderMollieReturn(memberId){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading">Betaling controleren…</div>`;
  const m = members.find(x=>x.id===memberId);
  if(!m || !m.mollieId){
    app.innerHTML = `<div class="card"><p class="muted">Geen betaling gevonden om te controleren.</p></div>`;
    return;
  }
  try{
    const res = await fetch(`${settings.mollieWorkerUrl.replace(/\/$/,'')}/payment-status?id=${encodeURIComponent(m.mollieId)}`);
    const data = await res.json();
    if(data.status==='paid' && m){
      m.paidThisYear = true;
      m.molliePaymentStatus = 'paid';
      await saveMembers();
      app.innerHTML = `
        <div class="header"><p>Inschrijving ${escapeHtml(settings.naam||'Chiro')}</p><h1>Betaald — bedankt!</h1></div>
        <div class="card"><p class="muted">De betaling voor ${escapeHtml(m.naam)} is ontvangen en geregistreerd.</p></div>
      `;
    } else {
      app.innerHTML = `
        <div class="header"><p>Inschrijving ${escapeHtml(settings.naam||'Chiro')}</p><h1>Nog niet bevestigd</h1></div>
        <div class="card"><p class="muted">We hebben nog geen bevestiging van je betaling. Als je toch betaald hebt, komt dit automatisch goed zodra de leiding de betaling controleert — geen zorgen.</p></div>
      `;
    }
  }catch(e){
    app.innerHTML = `<div class="card"><p class="muted">Kon de betaalstatus niet controleren. Neem contact op met de leiding als je twijfelt.</p></div>`;
  }
}

/* ---------- Init ---------- */
(async function init(){
  try{
    await waitForFirestore();
    await loadAll();
    if(settings.naam) document.title = `Inschrijven — ${settings.naam}`;
    render();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="loading">Kon geen verbinding maken.<br><small>${escapeHtml(e.message||'')}</small></div>`;
  }
})();
</script>
</body>
</html>
